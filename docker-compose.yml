services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rolebot
      POSTGRES_PASSWORD: rolebot
      POSTGRES_DB: rolebot
    ports:
      - "5432:5432"
    volumes:
      - rolebot_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rolebot -d rolebot"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  rolebot_pg:
